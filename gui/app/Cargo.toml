[package]
name = "vlichen-app"
description = "The lichen wallet as an app: vlichen-gui's page and wallet in Tauri, for the desktop and Android"
version = "0.4.0"
edition = "2021"
license = "MIT"

[lib]
name = "vlichen_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
vlichen-gui = { path = "..", default-features = false }
